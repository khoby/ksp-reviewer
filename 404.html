  <title>WONK</title>
  <!-- GitHub Pages SPA fallback: any unmatched path bounces to the HashRouter app root,
       preserving the hash route if present. -->
  <script>
    var base = '/ksp-reviewer/';
    location.replace(base + (location.hash || ''));
  </script>
</head>
